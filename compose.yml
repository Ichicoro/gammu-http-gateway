services:
  modem-daemon:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    devices:
      # adjust to match your modem's device node
      - /dev/sim_modem:/dev/sim_modem
    volumes:
      - ./data:/data
      - ./gammurc:/etc/gammurc:ro        # gammu config file
      - ${SCRIPTS_DIR:-./scripts}:/scripts:ro
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      POLL_INTERVAL: "${POLL_INTERVAL:-30}"
      STATUS_INTERVAL: "${STATUS_INTERVAL:-60}"
      DB_PATH: "/data/sms.db"
      GAMMU_CONFIG: "/etc/gammurc"
      ON_SMS_SCRIPT: "${ON_SMS_SCRIPT:-}"
      ON_SMS_WEBHOOK: "${ON_SMS_WEBHOOK:-}"
      ON_STATUS_SCRIPT: "${ON_STATUS_SCRIPT:-}"
      ON_STATUS_WEBHOOK: "${ON_STATUS_WEBHOOK:-}"
    env_file:
      - .env                             # PUSHOVER_USER_KEY, PUSHOVER_APP_TOKEN, etc.
