<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modem Gateway</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen p-4 md:p-8 font-sans">
<div class="max-w-2xl mx-auto">

  <!-- Header -->
  <div class="flex items-center justify-between mb-6">
    <div class="flex items-center gap-3">
      <i data-lucide="radio" class="w-7 h-7 text-indigo-400 shrink-0"></i>
      <h1 class="text-xl font-bold tracking-tight">Modem Gateway</h1>
    </div>
    <div class="flex items-center gap-2 text-sm text-gray-400">
      <span id="conn-dot" class="w-2.5 h-2.5 rounded-full bg-gray-600 inline-block transition-colors duration-500"></span>
      <span id="conn-label" class="text-xs">connecting…</span>
    </div>
  </div>

  <!-- Cards -->
  <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-3">

    <!-- Signal -->
    <div class="bg-gray-900 rounded-2xl p-5 border border-gray-800">
      <div class="flex items-center gap-2 text-indigo-400 mb-3">
        <i data-lucide="signal" class="w-5 h-5 shrink-0"></i>
        <span class="text-xs font-semibold uppercase tracking-widest">Signal</span>
      </div>
      <div class="text-4xl font-bold mb-1" id="sig-pct">—</div>
      <div class="text-sm text-gray-400" id="sig-dbm"></div>
      <div class="text-xs text-gray-600 mt-1" id="sig-ber"></div>
    </div>

    <!-- Network -->
    <div class="bg-gray-900 rounded-2xl p-5 border border-gray-800">
      <div class="flex items-center gap-2 text-emerald-400 mb-3">
        <i data-lucide="wifi" class="w-5 h-5 shrink-0"></i>
        <span class="text-xs font-semibold uppercase tracking-widest">Network</span>
      </div>
      <div class="text-xl font-bold mb-1 truncate" id="net-name">—</div>
      <div class="text-sm" id="net-state"></div>
      <div class="text-xs text-gray-600 mt-1" id="net-code"></div>
    </div>

    <!-- Battery -->
    <div class="bg-gray-900 rounded-2xl p-5 border border-gray-800">
      <div class="flex items-center gap-2 text-amber-400 mb-3">
        <i data-lucide="battery" class="w-5 h-5 shrink-0" id="bat-icon-el"></i>
        <span class="text-xs font-semibold uppercase tracking-widest">Battery</span>
      </div>
      <div class="text-4xl font-bold mb-1" id="bat-pct">—</div>
      <div class="text-sm text-gray-400" id="bat-state"></div>
      <div class="text-xs text-gray-600 mt-1" id="bat-voltage"></div>
    </div>

  </div>

  <!-- Last updated -->
  <div class="text-xs text-gray-700 text-right mb-6" id="last-updated"></div>

  <!-- Messages -->
  <div class="bg-gray-900 rounded-2xl border border-gray-800 overflow-hidden">
    <div class="flex items-center gap-2 px-4 py-3 border-b border-gray-800">
      <i data-lucide="message-square" class="w-4 h-4 text-purple-400 shrink-0"></i>
      <span class="font-medium text-sm">Recent Messages</span>
      <span class="ml-auto text-xs text-gray-600" id="msg-count"></span>
    </div>
    <div id="msg-list" class="divide-y divide-gray-800/60">
      <div class="px-4 py-5 text-sm text-gray-600">Loading…</div>
    </div>
  </div>

</div>
<script>
lucide.createIcons();

const wsUrl = (location.protocol === 'https:' ? 'wss' : 'ws') + '://' + location.host + '/ws';
let ws, reconnDelay = 1000;

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function val(v, suffix) {
  return (v !== undefined && v !== null && v !== -1) ? v + (suffix || '') : '';
}

function updateStatus(data) {
  const { network, signal, battery, timestamp } = data;

  if (signal) {
    const pct = val(signal.signal_percent, '%');
    document.getElementById('sig-pct').textContent = pct || '—';
    document.getElementById('sig-dbm').textContent = val(signal.signal_strength, ' dBm');
    const ber = signal.bit_error_rate;
    document.getElementById('sig-ber').textContent = (ber !== -1 && ber !== undefined) ? 'BER ' + ber : '';
  }

  if (network) {
    document.getElementById('net-name').textContent = network.network_name || '—';
    const stEl = document.getElementById('net-state');
    const st = network.state || '';
    stEl.textContent = st;
    stEl.className = 'text-sm ' + (st === 'HomeNetwork' ? 'text-emerald-400' : st === 'Roaming' ? 'text-amber-400' : 'text-gray-500');
    const parts = [network.network_code, network.cell_id ? 'Cell ' + network.cell_id : ''].filter(Boolean);
    document.getElementById('net-code').textContent = parts.join(' · ');
  }

  if (battery) {
    const pct = val(battery.battery_percent, '%');
    document.getElementById('bat-pct').textContent = pct || '—';
    const charging = (battery.charge_state || '').toLowerCase().includes('charg');
    const iconEl = document.getElementById('bat-icon-el');
    iconEl.setAttribute('data-lucide', charging ? 'battery-charging' : 'battery');
    lucide.createIcons({ nodes: [iconEl] });
    document.getElementById('bat-state').textContent = battery.charge_state || '';
    const mv = battery.battery_voltage;
    document.getElementById('bat-voltage').textContent = (mv && mv !== -1) ? mv + ' mV' : '';
  }

  if (timestamp) {
    document.getElementById('last-updated').textContent = 'Updated ' + new Date(timestamp).toLocaleTimeString();
  }
}

function updateMessages(messages) {
  const list = document.getElementById('msg-list');
  document.getElementById('msg-count').textContent = messages.length ? messages.length + ' messages' : '';
  if (!messages.length) {
    list.innerHTML = '<div class="px-4 py-5 text-sm text-gray-600">No messages yet</div>';
    return;
  }
  list.innerHTML = messages.slice(0, 30).map(m => {
    const when = new Date(m.received_at || m.date);
    const dateStr = isNaN(when) ? '' : when.toLocaleString(undefined, { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
    return '<div class="px-4 py-3">' +
      '<div class="flex items-baseline justify-between gap-2 mb-0.5">' +
        '<span class="font-mono text-sm text-indigo-300">' + esc(m.number) + '</span>' +
        '<span class="text-xs text-gray-600 shrink-0">' + esc(dateStr) + '</span>' +
      '</div>' +
      '<div class="text-sm text-gray-300 break-words">' + esc(m.text) + '</div>' +
    '</div>';
  }).join('');
}

function setConn(ok) {
  document.getElementById('conn-dot').className = 'w-2.5 h-2.5 rounded-full inline-block transition-colors duration-500 ' + (ok ? 'bg-emerald-400' : 'bg-gray-600');
  document.getElementById('conn-label').textContent = ok ? 'live' : 'reconnecting…';
}

function connect() {
  ws = new WebSocket(wsUrl);
  ws.onopen = () => { reconnDelay = 1000; setConn(true); };
  ws.onmessage = e => {
    const msg = JSON.parse(e.data);
    if (msg.event === 'status') updateStatus(msg);
    if (msg.event === 'sms') loadMessages();
  };
  ws.onclose = ws.onerror = () => {
    setConn(false);
    reconnDelay = Math.min(reconnDelay * 2, 30000);
    setTimeout(connect, reconnDelay);
  };
}

async function loadStatus() {
  try {
    const r = await fetch('/status');
    updateStatus(await r.json());
  } catch(e) {}
}

async function loadMessages() {
  try {
    const r = await fetch('/messages?limit=30');
    updateMessages(await r.json());
  } catch(e) {}
}

loadStatus();
loadMessages();
connect();
setInterval(loadStatus, 60000);
setInterval(loadMessages, 60000);
</script>
</body>
</html>
