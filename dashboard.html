<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modem Gateway</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Space+Grotesk:wght@300..700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Space Grotesk', 'Space Mono', 'IBM Plex Mono', monospace, sans-serif;
  }
  pre, code, #msg-list, .text-code, #compose-number {
    font-family: 'Space Mono', 'IBM Plex Mono', monospace, sans-serif;
  }
</style>
</head>
<body class="bg-[#d8d7d1] dark:bg-[#0c0b08] text-[#1c1b18] dark:text-[#e8e4da] min-h-screen p-4 md:p-8">
<div class="max-w-2xl mx-auto">

  <!-- Header -->
  <div class="flex items-center justify-between mb-6 px-4 py-3 rounded-2xl bg-[#dddcd6] dark:bg-[#121009]">
    <div class="flex items-center gap-3">
      <i data-lucide="radio" class="w-7 h-7 text-[#9B1226] dark:text-[#f07828] shrink-0"></i>
      <h1 class="text-xl font-bold tracking-tight">Modem Gateway</h1>
    </div>
    <div class="flex items-center gap-2 text-sm text-[#7a7970] dark:text-[#5c5850]">
      <span id="conn-dot" class="w-2.5 h-2.5 rounded-full bg-[#9a9990] dark:bg-[#37332a] inline-block transition-colors duration-500"></span>
      <span id="conn-label" class="text-xs">connecting…</span>
    </div>
  </div>

  <!-- Cards -->
  <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-3">

    <!-- Signal -->
    <div class="bg-[#f2f1ea] dark:bg-[#161410] rounded-2xl p-5 border border-[#d0cfc8] dark:border-[#201e18]">
      <div class="flex items-center gap-2 text-[#9B1226] dark:text-[#f07828] mb-3">
        <i data-lucide="signal" class="w-5 h-5 shrink-0"></i>
        <span class="text-xs font-semibold uppercase tracking-widest">Signal</span>
      </div>
      <div class="text-code">
        <div class="text-4xl font-bold mb-1" id="sig-pct">—</div>
        <div class="text-sm text-[#7a7970] dark:text-[#5c5850]" id="sig-dbm"></div>
        <div class="text-xs text-[#9a9990] dark:text-[#37332a] mt-1" id="sig-ber"></div>
      </div>
    </div>

    <!-- Network -->
    <div class="bg-[#f2f1ea] dark:bg-[#161410] rounded-2xl p-5 border border-[#d0cfc8] dark:border-[#201e18]">
      <div class="flex items-center gap-2 text-[#168c3c] dark:text-[#22c55e] mb-3">
        <i data-lucide="wifi" class="w-5 h-5 shrink-0"></i>
        <span class="text-xs font-semibold uppercase tracking-widest">Network</span>
      </div>
      <div class="text-code">
        <div class="text-xl font-bold mb-1 truncate" id="net-name">—</div>
        <div class="text-sm" id="net-state"></div>
        <div class="text-xs text-[#9a9990] dark:text-[#37332a] mt-1" id="net-code"></div>
      </div>
    </div>

    <!-- Battery -->
    <div class="bg-[#f2f1ea] dark:bg-[#161410] rounded-2xl p-5 border border-[#d0cfc8] dark:border-[#201e18]">
      <div class="flex items-center gap-2 text-[#9B1226] dark:text-[#f07828] mb-3">
        <i data-lucide="battery" class="w-5 h-5 shrink-0" id="bat-icon-el"></i>
        <span class="text-xs font-semibold uppercase tracking-widest">Battery</span>
      </div>
      <div class="text-code">
        <div class="text-4xl font-bold mb-1" id="bat-pct">—</div>
        <div class="text-sm text-[#7a7970] dark:text-[#5c5850]" id="bat-state"></div>
        <div class="text-xs text-[#9a9990] dark:text-[#37332a] mt-1" id="bat-voltage"></div>
      </div>
    </div>

  </div>

  <!-- Last updated -->
  <div class="text-xs text-[#b0afa8] dark:text-[#2e2a1e] text-right mb-6" id="last-updated"></div>

  <!-- Compose -->
  <div class="bg-[#f2f1ea] dark:bg-[#161410] rounded-2xl border border-[#d0cfc8] dark:border-[#201e18] overflow-hidden mb-3">
    <div class="flex items-center gap-2 px-4 py-3 border-b border-[#dddcd5] dark:border-[#1a1814]">
      <i data-lucide="send" class="w-4 h-4 text-[#9B1226] dark:text-[#f07828] shrink-0"></i>
      <span class="font-medium text-sm dark:text-[#d8d2c4]">Send Message</span>
    </div>
    <div class="p-4 flex flex-col gap-3">
      <input id="compose-number" type="tel" placeholder="+1234567890"
        class="bg-[#e6e5de] dark:bg-[#100f0b] border border-[#c8c7c0] dark:border-[#201e18] rounded-lg px-3 py-2 text-sm font-mono placeholder-[#9a9990] dark:placeholder-[#3d3928] focus:outline-none focus:border-[#9B1226] dark:focus:border-[#f07828] transition-colors">
      <textarea id="compose-text" rows="3" placeholder="Message text…"
        class="bg-[#e6e5de] dark:bg-[#100f0b] border border-[#c8c7c0] dark:border-[#201e18] rounded-lg px-3 py-2 text-sm placeholder-[#9a9990] dark:placeholder-[#3d3928] resize-none focus:outline-none focus:border-[#9B1226] dark:focus:border-[#f07828] transition-colors"></textarea>
      <div class="flex items-center gap-3">
        <button id="compose-btn" onclick="sendMessage()"
          class="flex items-center gap-2 bg-[#9B1226] dark:bg-[#f07828] hover:brightness-110 disabled:opacity-40 disabled:cursor-not-allowed text-white text-sm font-medium px-4 py-2 rounded-lg transition-colors">
          <i data-lucide="send" class="w-4 h-4 shrink-0"></i>
          Send
        </button>
        <span id="compose-status" class="text-xs text-[#7a7970] dark:text-[#5c5850]"></span>
      </div>
    </div>
  </div>

  <!-- Messages -->
  <div class="bg-[#f2f1ea] dark:bg-[#161410] rounded-2xl border border-[#d0cfc8] dark:border-[#201e18] overflow-hidden">
    <div class="flex items-center gap-2 px-4 py-3 border-b border-[#dddcd5] dark:border-[#1a1814]">
      <i data-lucide="message-square" class="w-4 h-4 text-[#7a7970] dark:text-[#c8c3b4] shrink-0"></i>
      <span class="font-medium text-sm dark:text-[#d8d2c4]">Recent Messages</span>
      <span class="ml-auto text-xs text-[#9a9990] dark:text-[#37332a]" id="msg-count"></span>
    </div>
    <div id="msg-list" class="divide-y divide-[#dddcd5] dark:divide-[#161410]">
      <div class="px-4 py-5 text-sm text-[#9a9990] dark:text-[#37332a]">Loading…</div>
    </div>
  </div>

</div>
<script>
lucide.createIcons();

const wsUrl = (location.protocol === 'https:' ? 'wss' : 'ws') + '://' + location.host + '/ws';
let ws, reconnDelay = 1000;

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function val(v, suffix) {
  return (v !== undefined && v !== null && v !== -1) ? v + (suffix || '') : '';
}

function updateStatus(data) {
  const { network, signal, battery, timestamp } = data;

  if (signal) {
    const pct = val(signal.signal_percent, '%');
    document.getElementById('sig-pct').textContent = pct || '—';
    document.getElementById('sig-dbm').textContent = val(signal.signal_strength, ' dBm');
    const ber = signal.bit_error_rate;
    document.getElementById('sig-ber').textContent = (ber !== -1 && ber !== undefined) ? 'BER ' + ber : '';
  }

  if (network) {
    document.getElementById('net-name').textContent = network.network_name || '—';
    const stEl = document.getElementById('net-state');
    const st = network.state || '';
    stEl.textContent = st;
    stEl.className = 'text-sm ' + (st === 'HomeNetwork' ? 'text-[#168c3c] dark:text-[#22c55e]' : st === 'Roaming' ? 'text-[#9B1226] dark:text-[#f07828]' : 'text-[#7a7970] dark:text-[#5c5850]');
    const parts = [network.network_code, network.cell_id ? 'Cell ' + network.cell_id : ''].filter(Boolean);
    document.getElementById('net-code').textContent = parts.join(' · ');
  }

  if (battery) {
    const pct = val(battery.battery_percent, '%');
    document.getElementById('bat-pct').textContent = pct || '—';
    const charging = (battery.charge_state || '').toLowerCase().includes('charg');
    const iconEl = document.getElementById('bat-icon-el');
    iconEl.setAttribute('data-lucide', charging ? 'battery-charging' : 'battery');
    lucide.createIcons({ nodes: [iconEl] });
    document.getElementById('bat-state').textContent = battery.charge_state || '';
    const mv = battery.battery_voltage;
    document.getElementById('bat-voltage').textContent = (mv && mv !== -1) ? mv + ' mV' : '';
  }

  if (timestamp) {
    document.getElementById('last-updated').textContent = 'Updated ' + new Date(timestamp).toLocaleTimeString();
  }
}

function updateMessages(messages) {
  const list = document.getElementById('msg-list');
  document.getElementById('msg-count').textContent = messages.length ? messages.length + ' messages' : '';
  if (!messages.length) {
    list.innerHTML = '<div class="px-4 py-5 text-sm text-[#9a9990] dark:text-[#37332a]">No messages yet</div>';
    return;
  }
  list.innerHTML = messages.slice(0, 30).map(m => {
    const when = new Date(m.received_at || m.date);
    const dateStr = isNaN(when) ? '' : when.toLocaleString(undefined, { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
    const out = m.direction === 'outgoing';
    const numColor = 'text-[#9B1226] dark:text-[#f07828]';
    const badge = out
      ? '<span class="text-xs bg-[#168c3c]/10 text-[#168c3c] dark:text-[#22c55e] border border-[#168c3c]/30 dark:border-[#22c55e]/30 rounded px-1.5 py-0.5 ml-2 shrink-0">sent</span>'
      : '';
    return '<div class="px-4 py-3">' +
      '<div class="flex items-baseline justify-between gap-2 mb-0.5">' +
        '<div class="flex items-center gap-1 min-w-0">' +
          '<span class="font-mono text-sm ' + numColor + ' truncate">' + esc(m.number) + '</span>' +
          badge +
        '</div>' +
        '<span class="text-xs text-[#9a9990] dark:text-[#37332a] shrink-0">' + esc(dateStr) + '</span>' +
      '</div>' +
      '<div class="text-sm text-[#1c1b18] dark:text-[#e8e4da] break-words">' + esc(m.text) + '</div>' +
    '</div>';
  }).join('');
}

async function sendMessage() {
  const number = document.getElementById('compose-number').value.trim();
  const text = document.getElementById('compose-text').value.trim();
  const btn = document.getElementById('compose-btn');
  const status = document.getElementById('compose-status');

  if (!number || !text) {
    status.textContent = 'Number and message required.';
    status.className = 'text-xs text-[#9B1226] dark:text-[#f07828]';
    return;
  }

  btn.disabled = true;
  status.textContent = 'Sending…';
  status.className = 'text-xs text-[#7a7970] dark:text-[#5c5850]';

  try {
    const r = await fetch('/send', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({number, text}),
    });
    const data = await r.json();
    if (data.ok) {
      document.getElementById('compose-text').value = '';
      status.textContent = 'Sent.';
      status.className = 'text-xs text-[#168c3c] dark:text-[#22c55e]';
      loadMessages();
    } else {
      status.textContent = data.error || 'Failed.';
      status.className = 'text-xs text-[#9B1226] dark:text-[#f07828]';
    }
  } catch(e) {
    status.textContent = 'Network error.';
    status.className = 'text-xs text-[#9B1226] dark:text-[#f07828]';
  } finally {
    btn.disabled = false;
  }
}

function setConn(ok) {
  document.getElementById('conn-dot').className = 'w-2.5 h-2.5 rounded-full inline-block transition-colors duration-500 ' + (ok ? 'bg-[#168c3c] dark:bg-[#22c55e]' : 'bg-[#9a9990] dark:bg-[#37332a]');
  document.getElementById('conn-label').textContent = ok ? 'live' : 'reconnecting…';
}

function connect() {
  ws = new WebSocket(wsUrl);
  ws.onopen = () => { reconnDelay = 1000; setConn(true); };
  ws.onmessage = e => {
    const msg = JSON.parse(e.data);
    if (msg.event === 'status') updateStatus(msg);
    if (msg.event === 'sms') loadMessages();
  };
  ws.onclose = ws.onerror = () => {
    setConn(false);
    reconnDelay = Math.min(reconnDelay * 2, 30000);
    setTimeout(connect, reconnDelay);
  };
}

async function loadStatus() {
  try {
    const r = await fetch('/status');
    updateStatus(await r.json());
  } catch(e) {}
}

async function loadMessages() {
  try {
    const r = await fetch('/messages?limit=30');
    updateMessages(await r.json());
  } catch(e) {}
}

loadStatus();
loadMessages();
connect();
setInterval(loadStatus, 60000);
setInterval(loadMessages, 60000);
</script>
</body>
</html>
